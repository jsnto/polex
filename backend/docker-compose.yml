services:
  backend:
    build: .
    container_name: polex-backend
    # IMPORTANT: host networking is required for Wake-on-LAN.
    # With the default bridge network, UDP broadcasts to 255.255.255.255:9
    # never leave the host, so WOL would silently fail.
    network_mode: host
    environment:
      ADDR: ":8080"
      CHECK_INTERVAL: 10s        # how often servers are TCP-checked
      # WOL_BROADCAST: "192.168.1.255:9"   # extra WOL targets if needed
      # Login credentials — compose auto-loads backend/.env for these
      # ${VAR:-default} expansions if it exists (template: .env.example).
      POLEX_USERNAME: ${POLEX_USERNAME:-admin}
      POLEX_PASSWORD: ${POLEX_PASSWORD:-polex}
      POLEX_TOKEN_TTL: ${POLEX_TOKEN_TTL:-720h}
      POLEX_REMEMBER_TTL: ${POLEX_REMEMBER_TTL:-720h}
    volumes:
      - ./data:/app/data         # persists data.json (server list)
      # SSH power-off keys (optional): a server with sshUser + sshKeyPath
      # set is powered off via `systemctl poweroff` over SSH with that key
      # (a password-only sshPassword needs no key file). The private
      # key lives as a file on this host — mount it into the container and
      # point the server's sshKeyPath at the in-container path, e.g.:
      #   - ./ssh:/app/ssh:ro
      #   (sshKeyPath: "/app/ssh/id_ed25519")
      # Only path references go into data.json — never key material.
    restart: unless-stopped
